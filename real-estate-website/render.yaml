services:
  - type: web
    name: real-estate-website
    env: php
    plan: free
    buildCommand: |
      # Install any PHP extensions if needed
      apt-get update
      apt-get install -y libpq-dev
      docker-php-ext-install pdo_mysql
    startCommand: "php -S 0.0.0.0:8080 -t ."
    envVars:
      - key: PHP_VERSION
        value: "8.2"
      - key: DB_HOST
        value: "your-database-host"  # Replace with your Render MySQL database host
      - key: DB_NAME
        value: "real_estate_db"
      - key: DB_USER
        value: "your-db-user"  # Replace with your Render MySQL database user
      - key: DB_PASS
        value: "your-db-password"  # Replace with your Render MySQL database password
