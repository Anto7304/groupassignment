services:
  - type: web
    name: real-estate-website
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_HOST
        value: "your-database-host"  # Replace with your Render MySQL database host
      - key: DB_NAME
        value: "real_estate_db"
      - key: DB_USER
        value: "your-db-user"  # Replace with your Render MySQL database user
      - key: DB_PASS
        value: "your-db-password"  # Replace with your Render MySQL database password
